<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Trắc nghiệm Pháp luật về Thuế</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: tờ tiền in guilloche. Nền xanh mực với hoa văn an ninh vàng đồng,
   phù hiệu thuế bay nhẹ. Slide 1 là danh sách thẻ "tem thuế"; mỗi câu hỏi là một slide hai cột. */
:root{
  --ink:#06211D; --ink-2:#0B332D; --line:#1C5A4E;
  --gold:#E4B85A; --gold-2:#F6DC96; --paper:#F4EEDA; --mute:#9DB8AF; --mint:#7FD6BE;
  --ok:#2DBE73; --ok-bg:#0E4B33; --bad:#EF4B55; --bad-bg:#541B21;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
.ico{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- nền ---------- */
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;
  background:
   radial-gradient(ellipse 70% 60% at 15% 8%,#0F4C41 0%,transparent 60%),
   radial-gradient(ellipse 60% 55% at 92% 95%,#0A3B49 0%,transparent 62%),
   var(--ink)}
#bg::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(115deg,rgba(228,184,90,.035) 0 1px,transparent 1px 7px),
   radial-gradient(ellipse at center,transparent 55%,rgba(2,12,10,.55) 100%)}
.layer{position:absolute;transition:transform 1.5s cubic-bezier(.2,.8,.2,1);transform:translate3d(calc(var(--shift,0)*var(--k,-2.5vw)),0,0)}
.rosette{width:64vmax;height:64vmax}
.rosette svg{width:100%;height:100%;animation:spin 200s linear infinite}
.rosette ellipse,.rosette circle{fill:none;stroke:var(--gold);stroke-opacity:.15;stroke-width:1}
.r-a{top:-24vmax;right:-20vmax}
.r-b{bottom:-30vmax;left:-24vmax;--k:3vw}
.r-b svg{animation-direction:reverse;animation-duration:260s}
@keyframes spin{to{transform:rotate(360deg)}}
.waves{left:0;right:0;bottom:0;height:30vh;overflow:hidden;--k:-1vw;
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent);mask-image:linear-gradient(to top,#000 10%,transparent)}
.waves svg{width:200%;height:100%;display:block;animation:drift 70s linear infinite}
.waves path{fill:none;stroke:var(--mint);stroke-opacity:.22;stroke-width:1}
@keyframes drift{to{transform:translateX(-50%)}}
.sky{left:0;right:0;bottom:0;height:36vh;--k:-4vw;color:var(--gold);opacity:.2;pointer-events:none}
.sky .ico{position:absolute;bottom:-1px;stroke-width:1.1}
.sky .b1{left:3vw;width:min(34vw,340px);height:min(34vw,340px)}
.sky .b2{right:4vw;width:min(44vw,440px);height:min(44vw,440px)}
.sky .b3{right:calc(4vw + min(44vw,440px) - 30px);width:min(16vw,170px);height:min(16vw,170px)}
.floaters{inset:0;--k:-5vw}
.fl{position:absolute;color:var(--gold);animation:bob var(--dur) ease-in-out var(--delay) infinite alternate;will-change:transform}
.fl.m{color:var(--mint)}
.fl .ico{width:100%;height:100%;stroke-width:1.6}
@keyframes bob{
  from{transform:translate3d(0,0,0) rotate(calc(var(--rot)*-1))}
  to{transform:translate3d(var(--dx),var(--dy),0) rotate(var(--rot))}}

/* ---------- khung ---------- */
.shell{position:absolute;z-index:1;left:50%;top:50%;width:1600px;height:900px;display:flex;flex-direction:column;
  transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;
  padding-left:max(64px,env(safe-area-inset-left,0px));padding-right:max(64px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:26px 10px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font-family:var(--display);font-weight:700;letter-spacing:.02em;color:var(--gold)}
.brand .ico{width:30px;height:30px;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:12px;flex:none}
.pips{display:flex;gap:8px;align-items:center}
.pip{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(228,184,90,.45);display:grid;place-items:center;font-size:.8rem;font-weight:600;color:var(--gold);transition:all .35s}
.pip:hover{background:rgba(228,184,90,.15)}
.pip.is-cur{box-shadow:0 0 0 3px rgba(228,184,90,.22);border-color:var(--gold)}
.pip.is-done{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.6rem 1rem;border-radius:5px;border:1px solid rgba(228,184,90,.5);color:var(--gold-2);font-weight:600;font-size:.9rem;transition:background .25s,transform .25s,color .25s}
.btn:hover{background:rgba(228,184,90,.14);transform:translateY(-1px)}
.btn.primary{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.btn.primary:hover{background:var(--gold-2)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}

/* ---------- slide + chuyển cảnh ---------- */
.slide{position:absolute;inset:0;display:flex;overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;
  transition:opacity .55s ease,transform .75s cubic-bezier(.2,.8,.2,1),visibility 0s linear .75s;outline:none}
.slide[data-from="r"]{transform:translateX(6%)}
.slide[data-from="l"]{transform:translateX(-6%)}
.slide.notrans{transition:none}
.slide.is-active{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.slide.is-out-l{transform:translateX(-6%)}
.slide.is-out-r{transform:translateX(6%)}
.rise{opacity:1}
.slide.is-active .rise{animation:rise .85s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*95ms + 220ms)}
@keyframes rise{from{opacity:0;transform:translateY(28px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}

/* ---------- slide danh sách ---------- */
.menu-inner{margin:auto;width:100%;max-width:1180px;padding-block:.5rem 1.5rem}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mint)}
.title{margin:.6rem 0 0;font-family:var(--display);font-weight:900;font-size:104px;line-height:.98;letter-spacing:-.01em;text-wrap:balance}
.title .l1,.title .l2{display:block}
.ch{display:inline-block;transform-origin:50% 100%}
.slide.is-active .ch{animation:letterIn .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*48ms + 250ms)}
@keyframes letterIn{from{opacity:0;transform:translateY(.55em) rotateX(-70deg);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.shimmer{width:fit-content;color:transparent;background:linear-gradient(100deg,#C99A38 18%,#FFF3C9 38%,#E4B85A 52%,#C99A38 72%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text}
.slide.is-active .shimmer{animation:wipe 1.1s cubic-bezier(.6,.1,.2,1) .85s backwards,shine 5s linear 2s infinite}
@keyframes wipe{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% -5% -20% -5%)}}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.lead{margin:1.2rem 0 0;max-width:46ch;font-size:22px;line-height:1.6;color:var(--mute)}
.cards{list-style:none;margin:40px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;perspective:1100px}
.card{position:relative;display:flex;flex-direction:column;gap:.7rem;width:100%;height:100%;text-align:left;
  padding:28px;border-radius:6px;border:1px solid rgba(228,184,90,.38);
  background:linear-gradient(160deg,rgba(15,72,62,.82),rgba(6,33,29,.9));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 18px 40px -22px rgba(0,0,0,.7);
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ly,0));
  transition:transform .3s ease,border-color .3s,box-shadow .3s}
.card::before{content:"";position:absolute;inset:7px;border:1px dashed rgba(228,184,90,.26);border-radius:3px;pointer-events:none}
.card::after{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(246,220,150,.2),transparent 70%)}
.card:hover{--ly:-6px;border-color:var(--gold);box-shadow:0 26px 50px -24px rgba(228,184,90,.35)}
.card:hover::after{opacity:1}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.card-ico{width:56px;height:56px;color:var(--gold);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card:hover .card-ico{transform:rotate(-8deg) scale(1.12)}
.num{font-family:var(--display);font-weight:900;font-size:100px;line-height:.9;color:transparent;-webkit-text-stroke:1.5px var(--gold);transition:color .4s}
.card:hover .num{color:var(--gold)}
.topic{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.25;text-wrap:balance}
.status{margin-top:auto;font-size:.88rem;font-weight:600;color:var(--gold-2)}
.stamp{position:absolute;right:1.1rem;bottom:1.1rem;padding:.25rem .7rem;border:3px double var(--ok);border-radius:4px;color:var(--ok);
  font-family:var(--display);font-weight:900;font-size:1.15rem;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-9deg);opacity:0;background:rgba(6,33,29,.6)}
.card.is-done{border-color:rgba(45,190,115,.6)}
.card.is-done .status{color:var(--ok)}
.card.is-done .stamp{opacity:1}
.slide.is-active .card.is-done .stamp{animation:stamp .6s cubic-bezier(.2,1.4,.4,1) .9s backwards}
@keyframes stamp{from{opacity:0;transform:rotate(-24deg) scale(2.6)}to{opacity:1;transform:rotate(-9deg) scale(1)}}
.finale{display:flex;align-items:center;gap:1rem;margin-top:1.4rem;padding:1rem 1.25rem;border:1px solid rgba(45,190,115,.55);border-radius:6px;background:rgba(14,75,51,.55);font-weight:600}
.finale .ico{width:40px;height:40px;color:var(--gold);flex:none}

/* ---------- slide câu hỏi ---------- */
.q-wrap{margin:auto;width:100%;max-width:1220px;padding-block:.5rem 1.5rem;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:center}
.chip{display:inline-flex;align-items:baseline;gap:.5rem;padding:.35rem .9rem;border:1px solid rgba(228,184,90,.5);border-radius:99px;font-size:.82rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2)}
.chip b{font-family:var(--display);font-size:1.25rem;letter-spacing:0;color:var(--gold)}
.q-text{margin:1.1rem 0 0;font-family:var(--display);font-weight:600;font-size:30px;line-height:1.28;text-wrap:pretty}
.art{display:flex;gap:1rem;margin-top:1.6rem}
.art-i{position:relative;width:96px;aspect-ratio:1;border-radius:50%;border:1px dashed rgba(228,184,90,.55);display:grid;place-items:center;color:var(--gold);
  background:radial-gradient(circle,rgba(228,184,90,.12),transparent 70%);animation:bob 5s ease-in-out infinite alternate;--dx:0px;--dy:-8px;--rot:3deg}
.art-i:nth-child(2){animation-delay:-2.2s;--dy:8px;--rot:-3deg}
.art-i .ico{width:52%;height:52%}
.art-i::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(228,184,90,.2);border-top-color:var(--gold);animation:spin 9s linear infinite}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:.8rem}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1rem;align-items:center;width:100%;text-align:left;
  padding:.95rem 1.1rem;border-radius:6px;border:1px solid rgba(157,184,175,.3);background:rgba(8,45,39,.74);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  font-size:20px;line-height:1.5;transition:transform .3s,border-color .3s,background .3s,box-shadow .3s,opacity .4s}
.opt:hover{transform:translateX(6px);border-color:var(--gold);background:rgba(12,62,54,.85)}
.badge{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.2rem;border:1.5px solid var(--gold);color:var(--gold);transition:all .3s}
.opt:hover .badge{background:var(--gold);color:var(--ink)}
.mark{width:1.7rem;height:1.7rem;position:relative}
.mark svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:scale(.3) rotate(-30deg);transition:all .45s cubic-bezier(.2,1.5,.4,1);stroke-width:3.4}
.opt.is-right{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 0 0 3px rgba(45,190,115,.2),0 0 40px -6px rgba(45,190,115,.55);transform:translateX(8px)}
.opt.is-right .badge{background:var(--ok);border-color:var(--ok);color:#052016}
.opt.is-right .mark .tick{opacity:1;transform:none;color:var(--ok)}
.opt.is-wrong{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 0 0 3px rgba(239,75,85,.2),0 0 34px -6px rgba(239,75,85,.55);animation:shake .5s}
.opt.is-wrong .badge{background:var(--bad);border-color:var(--bad);color:#2a0508}
.opt.is-wrong .mark .cross{opacity:1;transform:none;color:var(--bad)}
.opts.locked .opt{pointer-events:none}
.opts.locked .opt:not(.is-right){opacity:.4}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-12px)}35%{transform:translateX(10px)}55%{transform:translateX(-7px)}75%{transform:translateX(5px)}}
.feedback{min-height:2.6rem;margin-top:1rem;display:flex;align-items:center;font-weight:600;color:var(--mute);font-size:1rem}
.feedback.ok{color:var(--ok)}
.feedback.bad{color:var(--bad)}
.feedback span{animation:fbIn .4s cubic-bezier(.2,.8,.2,1)}
@keyframes fbIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nav{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:.4rem}
.next:not([hidden]){animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(228,184,90,.55)}60%{box-shadow:0 0 0 12px rgba(228,184,90,0)}}

/* ---------- hiệu ứng xu ---------- */
#fx{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.coin-p{position:absolute;width:30px;height:30px;color:var(--gold-2);will-change:transform,opacity}
.coin-p .ico{width:100%;height:100%;stroke-width:2.2}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

  <symbol id="i-bars" viewBox="0 0 64 64"><path d="M6 58h52"/><rect x="11" y="38" width="9" height="20" fill="currentColor" fill-opacity=".1"/><rect x="27" y="28" width="9" height="30" fill="currentColor" fill-opacity=".1"/><rect x="43" y="16" width="9" height="42" fill="currentColor" fill-opacity=".1"/><path d="M11 28l15-10 10 4 16-14M45 8h7v7"/></symbol>
  <symbol id="i-receipt" viewBox="0 0 64 64"><path d="M16 6h32v52l-5-4-5 4-6-4-6 4-5-4-5 4z" fill="currentColor" fill-opacity=".1"/><path d="M23 18h18M23 27h18M23 36h10"/></symbol>

</svg>

<div id="bg" aria-hidden="true">
  <div class="layer rosette r-a"><svg id="ros-a" viewBox="-300 -300 600 600"></svg></div>
  <div class="layer rosette r-b"><svg id="ros-b" viewBox="-300 -300 600 600"></svg></div>
  <div class="layer waves"><svg id="waves" viewBox="0 0 2400 200" preserveAspectRatio="none"></svg></div>
  <div class="layer sky">
    <svg class="ico b1"><use href="#i-bars"/></svg>
    <svg class="ico b3"><use href="#i-calc"/></svg>
    <svg class="ico b2"><use href="#i-building"/></svg>
  </div>
  <div class="layer floaters" id="floaters"></div>
</div>
<div id="fx" aria-hidden="true"></div>

<div class="shell">
  <header class="bar">
    <div class="brand"><svg class="ico"><use href="#i-coin"/></svg><span>Pháp luật về thuế</span></div>
    <div class="tools">
      <div class="pips" id="pips" role="group" aria-label="Tiến độ các câu hỏi"></div>
      <button class="btn home" id="home" type="button" hidden>← Danh sách</button>
      <button class="btn fs" id="fs" type="button" aria-label="Bật hoặc tắt toàn màn hình">Toàn màn hình</button>
    </div>
  </header>
  <main class="stage" id="stage">
    <section class="slide is-active" id="s0" tabindex="-1" aria-label="Danh sách câu hỏi">
      <div class="menu-inner">
        <div class="eyebrow rise" style="--i:0">Bài trắc nghiệm</div>
        <h1 class="title" id="title" aria-label="Pháp luật về thuế"></h1>
        <p class="lead rise" style="--i:6">Chọn một câu hỏi để bắt đầu. Đáp án đúng hiện màu xanh, đáp án sai hiện màu đỏ và bạn được chọn lại.</p>
        <ul class="cards" id="cards"></ul>
        <div class="finale rise" id="finale" hidden><svg class="ico"><use href="#i-medal"/></svg><span>Hoàn thành! Bạn đã trả lời đúng cả 3 câu hỏi.</span></div>
      </div>
    </section>
  </main>
</div>

<script>
(function(){
  var L=['A','B','C','D'];
  var Q=[
    {topic:'Thuế trực thu và thuế gián thu',icons:['tag','person'],
     q:'Điểm khác biệt cơ bản nhất để phân biệt thuế trực thu và thuế gián thu là gì?',ans:2,
     o:['Thuế trực thu do người tiêu dùng cuối cùng chịu thuế thông qua giá cả hàng hóa, trong khi thuế gián thu đánh trực tiếp vào thu nhập của người nộp thuế.',
        'Thuế trực thu luôn có mức thuế suất cao hơn thuế gián thu đối với mọi loại hàng hóa và dịch vụ.',
        'Người nộp thuế đồng thời là người chịu thuế đối với thuế trực thu, còn người nộp thuế không đồng thời là người chịu thuế đối với thuế gián thu.',
        'Thuế trực thu chỉ áp dụng cho các doanh nghiệp sản xuất, còn thuế gián thu chỉ áp dụng cho các cá nhân có thu nhập cao.']},
    {topic:'Trách nhiệm của công dân',icons:['doc','shield'],
     q:'Là một công dân, em cần phải có trách nhiệm và nghĩa vụ nào dưới đây trong việc chấp hành pháp luật về thuế?',ans:0,
     o:['Chủ động, trung thực kê khai và nộp thuế đầy đủ, đúng hạn theo quy định của pháp luật.',
        'Chỉ cần nộp thuế đầy đủ khi cơ quan thuế phát hiện và gửi giấy nhắc nhở trực tiếp.',
        'Tìm mọi cách để lách luật, tối ưu hóa chi phí cá nhân nhằm giảm thiểu tối đa số tiền thuế phải đóng.',
        'Chỉ có nghĩa vụ nộp thuế khi tham gia kinh doanh lớn, còn học sinh và người lao động phổ thông không cần quan tâm.']},
    {topic:'Bài học từ tình huống thực tế',icons:['medal','gavel'],
     q:'Ông C là chủ một doanh nghiệp luôn nghiêm chỉnh kê khai và nộp thuế đầy đủ đúng hạn nên đã được cơ quan thuế biểu dương và khen thưởng. Ngược lại, ông V dùng thủ đoạn tinh vi để trốn thuế số tiền lớn nên đã bị cơ quan chức năng phát hiện và khởi tố hình sự. Từ tình huống thực tế này, bài học rút ra là gì?',ans:1,
     o:['Việc trốn thuế chỉ là hành vi vi phạm hành chính nhẹ, nếu bị phát hiện thì chỉ cần nộp phạt bổ sung là xong chứ không thể bị khởi tố nặng.',
        'Chấp hành nghiêm chỉnh nghĩa vụ nộp thuế mang lại uy tín, sự phát triển bền vững và được tôn vinh, trong khi hành vi trốn thuế sẽ phải trả giá đắt trước pháp luật.',
        'Trong kinh doanh, việc đôi khi tìm cách lách luật hoặc trốn thuế nhẹ là chuyện bình thường để tối ưu hóa lợi nhuận miễn là không bị phát hiện.',
        'Cơ quan thuế chỉ khen thưởng những doanh nghiệp đóng thuế lớn, còn việc tuân thủ pháp luật hay trốn thuế của các doanh nghiệp nhỏ không ảnh hưởng nhiều.']}
  ];
  var N=Q.length, done=[false,false,false], cur=0, celebrated=false;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $=function(s,r){return (r||document).querySelector(s)};
  var NS='http://www.w3.org/2000/svg';
  function use(id,cls){return '<svg class="ico '+(cls||'')+'" aria-hidden="true"><use href="#i-'+id+'"/></svg>'}

  /* ----- nền: hoa văn guilloche ----- */
  function rosette(el,n,rx,ry){
    var s='';
    for(var i=0;i<n;i++){s+='<ellipse rx="'+rx+'" ry="'+ry+'" transform="rotate('+(i*180/n).toFixed(2)+')"/>'}
    s+='<circle r="'+(rx+8)+'"/><circle r="'+(rx*0.42)+'"/><circle r="'+(rx*0.2)+'"/>';
    el.innerHTML=s;
  }
  rosette($('#ros-a'),44,285,92);
  rosette($('#ros-b'),36,285,120);
  (function(){
    var s='';
    for(var k=0;k<26;k++){
      var d='M0 '+(100+k*2.4).toFixed(1);
      for(var x=0;x<=2400;x+=20){
        var y=100+k*2.4+(30+k*1.4)*Math.sin(2*Math.PI*x/400+k*0.19)+14*Math.sin(2*Math.PI*x/800+k*0.4);
        d+=' L'+x+' '+y.toFixed(1);
      }
      s+='<path d="'+d+'"/>';
    }
    $('#waves').innerHTML=s;
  })();
  (function(){
    var seed=20261014;
    function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
    var set=['coin','percent','doc','calc','receipt','tag','coin','percent','bars','shield','coin','doc','medal','scales','coin','percent','receipt','calc'];
    var h='';
    set.forEach(function(id,i){
      var size=30+rnd()*58, x=rnd()*94, y=rnd()*88, op=.1+rnd()*.14;
      var dx=(rnd()*60-30).toFixed(0)+'px', dy=(rnd()*70-35).toFixed(0)+'px', rot=(rnd()*24-12).toFixed(0)+'deg';
      var dur=(7+rnd()*8).toFixed(1)+'s', del=(-rnd()*10).toFixed(1)+'s';
      var blur=size>70?' filter:blur(1.2px);':'';
      h+='<div class="fl'+(i%3===1?' m':'')+'" style="left:'+x.toFixed(1)+'%;top:'+y.toFixed(1)+'%;width:'+size.toFixed(0)+'px;height:'+size.toFixed(0)+'px;opacity:'+op.toFixed(2)+';--dx:'+dx+';--dy:'+dy+';--rot:'+rot+';--dur:'+dur+';--delay:'+del+';'+blur+'">'+use(id)+'</div>';
    });
    $('#floaters').innerHTML=h;
  })();

  /* ----- tiêu đề từng chữ ----- */
  (function(){
    var t=$('#title'), word='Pháp luật', i=0, h='<span class="l1" aria-hidden="true">';
    word.split('').forEach(function(c){ h+= c===' ' ? ' ' : '<span class="ch" style="--i:'+(i)+'">'+c+'</span>'; i++; });
    h+='</span><span class="l2 shimmer" aria-hidden="true">về thuế</span>';
    t.innerHTML=h;
  })();

  /* ----- dựng slide ----- */
  var stage=$('#stage'), slides=[$('#s0')];
  var cards=$('#cards');
  Q.forEach(function(q,i){
    var li=document.createElement('li'); li.className='rise'; li.style.setProperty('--i',String(7+i));
    li.innerHTML='<button class="card" type="button" data-go="'+(i+1)+'" aria-label="Câu hỏi '+(i+1)+': '+q.topic+'">'+
      '<span class="card-top"><span class="eyebrow">Câu hỏi</span>'+use(q.icons[0],'card-ico')+'</span>'+
      '<span class="num" aria-hidden="true">'+(i+1)+'</span>'+
      '<span class="topic">'+q.topic+'</span>'+
      '<span class="status">Chạm để trả lời →</span>'+
      '<span class="stamp" aria-hidden="true">Đã đúng</span></button>';
    cards.appendChild(li);

    var s=document.createElement('section');
    s.className='slide'; s.tabIndex=-1; s.setAttribute('aria-label','Câu hỏi '+(i+1));
    var opts=q.o.map(function(t,k){
      return '<li class="rise" style="--i:'+(2+k)+'"><button class="opt" type="button" data-k="'+k+'">'+
        '<span class="badge">'+L[k]+'</span><span class="txt">'+t+'</span>'+
        '<span class="mark" aria-hidden="true">'+use('tick','tick')+use('cross','cross')+'</span></button></li>';
    }).join('');
    s.innerHTML='<div class="q-wrap">'+
      '<div class="q-left">'+
        '<div class="chip rise" style="--i:0">Câu hỏi <b>'+(i+1)+'</b> / '+N+'</div>'+
        '<h2 class="q-text rise" style="--i:1">'+q.q+'</h2>'+
        '<div class="art rise" style="--i:3" aria-hidden="true"><span class="art-i">'+use(q.icons[0])+'</span><span class="art-i">'+use(q.icons[1])+'</span></div>'+
      '</div>'+
      '<div class="q-right"><ul class="opts">'+opts+'</ul>'+
        '<div class="feedback" role="status" aria-live="polite"><span>Chạm hoặc nhấn phím A, B, C, D để chọn đáp án.</span></div>'+
        '<div class="nav"><button class="btn back" type="button">← Danh sách câu hỏi</button>'+
        '<button class="btn primary next" type="button" hidden>'+(i<N-1?'Câu tiếp theo →':'Hoàn thành →')+'</button></div>'+
      '</div></div>';
    stage.appendChild(s); slides.push(s);
  });

  /* ----- thanh tiến độ ----- */
  var pips=$('#pips');
  Q.forEach(function(q,i){
    var b=document.createElement('button'); b.className='pip'; b.type='button'; b.textContent=String(i+1);
    b.setAttribute('aria-label','Đến câu hỏi '+(i+1)); b.addEventListener('click',function(){go(i+1)});
    pips.appendChild(b);
  });

  /* ----- hiệu ứng xu ----- */
  function burst(x,y,n,spread){
    if(reduce) return;
    var fx=$('#fx');
    for(var i=0;i<n;i++){
      (function(){
        var el=document.createElement('span'); el.className='coin-p'; el.innerHTML=use('coin');
        el.style.left=x+'px'; el.style.top=y+'px'; fx.appendChild(el);
        var ang=(-90+(Math.random()*2-1)*(spread||75))*Math.PI/180, sp=240+Math.random()*340;
        var dx=Math.cos(ang)*sp, dy=Math.sin(ang)*sp, r=(Math.random()*2-1)*540, sc=.7+Math.random()*.8;
        var a=el.animate([
          {transform:'translate(-50%,-50%) scale(.3) rotate(0deg)',opacity:1},
          {transform:'translate(calc(-50% + '+dx*.55+'px),calc(-50% + '+dy*.55+'px)) scale('+sc+') rotate('+r*.5+'deg)',opacity:1,offset:.42},
          {transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+(dy+420)+'px)) scale('+(sc*.8)+') rotate('+r+'deg)',opacity:0}
        ],{duration:1200+Math.random()*800,easing:'cubic-bezier(.2,.7,.4,1)',delay:Math.random()*120});
        a.onfinish=function(){el.remove()};
      })();
    }
  }

  /* ----- điều hướng ----- */
  function go(to){
    if(to===cur||to<0||to>N) return;
    var dir=to>cur?1:-1, out=slides[cur], inn=slides[to];
    inn.classList.add('notrans'); inn.dataset.from=dir>0?'r':'l';
    inn.classList.remove('is-active','is-out-l','is-out-r'); void inn.offsetWidth;
    inn.classList.remove('notrans'); inn.classList.add('is-active');
    out.classList.remove('is-active'); out.classList.add(dir>0?'is-out-l':'is-out-r');
    cur=to;
    $('#bg').style.setProperty('--shift',String(cur));
    updateUI();
    try{inn.focus({preventScroll:true})}catch(e){}
    if(cur===0&&done.every(Boolean)&&!celebrated){
      celebrated=true;
      setTimeout(function(){var w=innerWidth,h=innerHeight;burst(w*.3,h*.7,30,60);burst(w*.7,h*.7,30,60);burst(w*.5,h*.75,36,80)},650);
    }
  }
  function updateUI(){
    $('#home').hidden=(cur===0);
    var ps=pips.children;
    for(var i=0;i<N;i++){ps[i].classList.toggle('is-done',done[i]);ps[i].classList.toggle('is-cur',cur===i+1)}
    var cs=cards.querySelectorAll('.card');
    for(var j=0;j<N;j++){
      cs[j].classList.toggle('is-done',done[j]);
      cs[j].querySelector('.status').textContent=done[j]?'Đã trả lời đúng ✓':'Chạm để trả lời →';
    }
    $('#finale').hidden=!done.every(Boolean);
  }

  /* ----- chọn đáp án ----- */
  var timers={};
  function setFb(slide,cls,msg){
    var fb=$('.feedback',slide); fb.className='feedback '+cls; fb.innerHTML='<span></span>'; fb.firstChild.textContent=msg;
  }
  function pick(qi,k){
    var slide=slides[qi+1];
    if(cur!==qi+1||done[qi]) return;
    var btn=slide.querySelectorAll('.opt')[k];
    if(!btn||btn.classList.contains('is-wrong')) return;
    if(k===Q[qi].ans){
      done[qi]=true;
      clearTimeout(timers[qi]);
      slide.querySelectorAll('.opt').forEach(function(o){o.classList.remove('is-wrong')});
      btn.classList.add('is-right'); $('.opts',slide).classList.add('locked');
      setFb(slide,'ok','Chính xác! Đáp án đúng là '+L[k]+'.');
      var nx=$('.next',slide); nx.hidden=false; try{nx.focus({preventScroll:true})}catch(e){}
      var r=btn.getBoundingClientRect(); burst(r.left+r.width*.5,r.top+r.height*.5,22,70);
      updateUI();
    }else{
      btn.classList.add('is-wrong');
      setFb(slide,'bad','Chưa chính xác. Hãy chọn lại.');
      try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
      setTimeout(function(){btn.classList.remove('is-wrong')},1400);
      clearTimeout(timers[qi]);
      timers[qi]=setTimeout(function(){
        if(!done[qi]) setFb(slide,'','Chạm hoặc nhấn phím A, B, C, D để chọn đáp án.');
      },1800);
    }
  }
  function nextQ(){ go(cur<N?cur+1:0) }

  Q.forEach(function(q,qi){
    var slide=slides[qi+1];
    slide.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){pick(qi,+b.dataset.k)})});
    $('.back',slide).addEventListener('click',function(){go(0)});
    $('.next',slide).addEventListener('click',function(){ if(qi<N-1) go(qi+2); else go(0) });
  });
  cards.querySelectorAll('.card').forEach(function(c){
    c.addEventListener('click',function(){go(+c.dataset.go)});
    c.addEventListener('pointermove',function(e){
      var r=c.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
      c.style.setProperty('--rx',((.5-y)*9).toFixed(2)+'deg'); c.style.setProperty('--ry',((x-.5)*11).toFixed(2)+'deg');
      c.style.setProperty('--mx',(x*100).toFixed(1)+'%'); c.style.setProperty('--my',(y*100).toFixed(1)+'%');
    });
    c.addEventListener('pointerleave',function(){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')});
  });
  $('#home').addEventListener('click',function(){go(0)});

  function toggleFs(){
    try{
      if(document.fullscreenElement){ var p=document.exitFullscreen&&document.exitFullscreen(); if(p&&p.catch)p.catch(function(){}); }
      else{ var r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); if(r&&r.catch)r.catch(function(){}); }
    }catch(e){}
  }
  $('#fs').addEventListener('click',toggleFs);

  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var k=e.key.toLowerCase();
    if(k==='f'){toggleFs();return}
    if(cur===0){ if(k==='1'||k==='2'||k==='3') go(+k); return }
    if(k.length===1&&'abcd'.indexOf(k)>-1){ pick(cur-1,'abcd'.indexOf(k)); return }
    if(k==='escape'||k==='backspace'||k==='h'){ go(0); return }
    if((k==='arrowright'||k==='enter')&&done[cur-1]&&document.activeElement===slides[cur]) nextQ();
  });

  function fit(){
    var s=Math.min(innerWidth/1600,innerHeight/900);
    $('.shell').style.setProperty('--s',s.toFixed(4));
  }
  addEventListener('resize',fit); fit();
  updateUI();
})();
</script>

</body></html>
